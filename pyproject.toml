[project]
name = "market-trends"
version = "0.1.0"
description = "Computes the long-run financial series published at jameswarrick.com/money/trends/"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "James Warrick" }]
keywords = ["finance", "economics", "time-series", "open-data"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Financial and Insurance Industry",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Office/Business :: Financial :: Investment",
]
dependencies = [
    "httpx>=0.27",
]

[project.scripts]
trends = "market_trends.cli:main"

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.6"]
docs = ["mkdocs>=1.6,<2", "mkdocs-material>=9.5"]

[project.urls]
Homepage = "https://www.jameswarrick.com/money/trends/"
Documentation = "https://nimbleox.github.io/market-trends/"
Source = "https://github.com/NimbleOx/market-trends"
Issues = "https://github.com/NimbleOx/market-trends/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/market_trends"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
# Errors, pyflakes and import order. The formatter is deliberately not enforced.
select = ["E", "F", "I"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["network: hits a live upstream; deselect with -m 'not network'"]
